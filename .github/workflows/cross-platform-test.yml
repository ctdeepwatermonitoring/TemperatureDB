name: Cross-Platform QC Pipeline Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-qc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"

      - name: Run QC pipeline
        run: |
          mkdir -p test_data/Upload/Cont_Data
          echo "2025-01-01 12:00:00,25.5" > test_data/Upload/Cont_Data/test1.csv
          echo "2025-01-02 12:00:00,26.0" > test_data/Upload/Cont_Data/test2.csv
          python db/db_app/insert_temp_results_cross_platform.py
